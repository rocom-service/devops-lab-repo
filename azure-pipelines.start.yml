trigger: none

pool:
  vmImage: ubuntu-latest

variables:
  greeting: Hallo aus Azure Pipelines

steps:
- checkout: self
- task: PowerShell@2
  displayName: Umgebung anzeigen
  inputs:
    targetType: inline
    pwsh: true
    script: |
      Write-Host "$(greeting)"
      Write-Host "Build ID: $(Build.BuildId)"
      Write-Host "Agent: $(Agent.OS)"
