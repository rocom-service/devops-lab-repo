<title id="title">Lab 01 – Teil A: Teilnehmer-Template für OrderFlow</title>
<desc id="desc">Ausfüllbares Template für Lab 01 Teil A. Sechs Wertstromphasen, Product Owner, Entwicklung, QA, Betrieb und separater Reviewer dienen als Orientierung. Verantwortungen, wichtige Ressourcen, Wartepunkt, Feedbackproblem und testbare Verbesserung sind auszufüllen. Rollen und Grenzen können angepasst werden.</desc>
